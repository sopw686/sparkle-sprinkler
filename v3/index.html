<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sparkle Sprinkler</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath fill=%27%23b0147e%27 d=%27M12 1l3 8 8 3-8 3-3 8-3-8-8-3 8-3z%27/%3E%3C/svg%3E">
  <meta name="description" content="Type normally and the Sparkle Sprinkler adds cute text emoticons to every sentence.">
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <h1>Sparkle Sprinkler</h1>
      <p class="intro">Use the Sparkle Sprinkler to add flair to your writing!</p>
    </header>

    <aside class="side side-left" aria-hidden="true"></aside>

    <main class="machine">
      <div class="controls">
        <div class="control">
          <span class="label" id="tone-label">Tone Select</span>
          <div class="select" id="tone">
            <button type="button" class="select-field" id="tone-button"
                    aria-haspopup="listbox" aria-expanded="false" aria-labelledby="tone-label tone-button">
              <span class="select-value" id="tone-value">Select…</span>
              <span class="select-arrow" aria-hidden="true"></span>
            </button>
            <ul class="select-list" id="tone-list" role="listbox" aria-multiselectable="true"
                aria-labelledby="tone-label" tabindex="-1" hidden></ul>
          </div>
        </div>
        <div class="control">
          <label class="label" for="cuteness">Cuteness Level</label>
          <input type="range" id="cuteness" class="dial" min="1" max="5" step="1" value="3">
        </div>
      </div>

      <div class="paper">
        <textarea id="writing" spellcheck="true" aria-label="Your text"
                  placeholder="Type here! Keep typing and emoticons will sprinkle themselves in as you go."></textarea>
      </div>

      <div class="actions">
        <button type="button" class="copy" id="copy">Copy</button>
        <span class="status" id="status" role="status" aria-live="polite"></span>
      </div>
    </main>

    <aside class="side side-right" aria-hidden="true"></aside>
  </div>
</body>
</html>
